name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      node-versions:
        required: false
        type: string
        default: '["20", "22"]'
      run-lint:
        required: false
        type: boolean
        default: true
    outputs:
      build-status:
        description: "Resultado de la construcción"
        value: ${{ jobs.build.outputs.status }}

jobs:
  test-matrix:
    name: Test Node.js v${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(inputs.node-versions) }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Simular pruebas
        run: |
          echo "Simulando ejecución de pruebas en Node.js v${{ matrix.node }}..."
          echo "Pruebas pasadas exitosamente."

  build:
    name: Build & Package
    needs: test-matrix
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.set-output.outputs.status }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear carpeta dist simulada
        run: |
          mkdir -p dist
          echo "<h1>App Compilada</h1>" > dist/index.html

      - name: Guardar Artifact de producción
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          retention-days: 1

      - id: set-output
        run: echo "status=success" >> $GITHUB_OUTPUT
